<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Smart Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="container">

    <!-- Navigation -->

    <div class="navbar">

        <a href="{{ url_for('dashboard') }}">
            🏠 Dashboard
        </a>

        <a href="{{ url_for('add_expense') }}">
            ➕ Add Expense
        </a>

        <a href="{{ url_for('expenses') }}">
            📋 Expenses
        </a>

        <a href="{{ url_for('budget') }}">
            💰 Budget
        </a>

        <a href="{{ url_for('reports') }}">
            📊 Reports
        </a>

        <a href="{{ url_for('profile') }}">
            👤 Profile
        </a>

        <a href="{{ url_for('logout') }}">
            🚪 Logout
        </a>

    </div>


    <!-- Profile Header -->

    <div class="profile-header">

        <div class="profile-avatar">
            👤
        </div>

        <div>

            <h1>My Profile</h1>

            <p>
                Manage your personal information
                and account settings.
            </p>

        </div>

    </div>


    <!-- Profile Card -->

    <div class="profile-card">

        <h2>Personal Information</h2>

        <form method="POST">

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.name }}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    value="{{ user.email }}"
                    disabled
                >

                <small>
                    Email address cannot be changed.
                </small>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Leave blank to keep current password"
                >

                <small>
                    Leave this field blank if you don't want
                    to change your password.
                </small>

            </div>


            <!-- Buttons -->

            <div class="profile-actions">

                <button type="submit">
                    💾 Save Changes
                </button>

                <a href="{{ url_for('dashboard') }}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
